name: AutoApplyPilot Scheduled Pipeline

on:
  schedule:
    # Runs every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Trigger Discovery & Scoring Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Automated Job Discovery
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://autoapplypilot.dev' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering Discovery cycle on ${APP_URL}..."
          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi
          
          curl -f -s -S -X GET \
            -H "$AUTH_HEADER" \
            "${APP_URL}/api/cron/discover?country=India&roles=Senior%20Full%20Stack%20Developer,Full%20Stack%20Engineer,Backend%20Engineer" \
            || echo "Discovery completed with notice."

      - name: Trigger Scoring & Queue Processing
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://autoapplypilot.dev' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering Processing cycle on ${APP_URL}..."
          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi
          
          curl -f -s -S -X GET \
            -H "$AUTH_HEADER" \
            "${APP_URL}/api/cron/process" \
            || echo "Processing completed with notice."

